<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Graveyard Whack!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #301844 0%, #191029 45%, #0a0712 100%);
    color: #e2dbf5;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 10px 24px;
    overflow-x: hidden;
    cursor: default;
    position: relative;
  }

  /* Spooky graveyard background atmosphere */
  .cemetery-sky {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .moon {
    position: absolute; top: 18px; right: 8%; width: 72px; height: 72px;
    background: radial-gradient(circle, #fffbe6 30%, #e6d385 70%, #a89445 100%);
    border-radius: 50%;
    box-shadow: 0 0 45px rgba(255,245,170,0.55), 0 0 100px rgba(160,110,255,0.25);
  }
  .moon::after {
    content: ""; position: absolute; width: 18px; height: 14px; top: 16px; left: 18px;
    background: rgba(0,0,0,0.08); border-radius: 50%;
  }
  .bat {
    position: absolute; font-size: 1.5rem; opacity: 0.35;
    animation: batFly 18s linear infinite;
  }
  @keyframes batFly {
    0% { transform: translate(-80px, 40px) scale(0.7); opacity: 0; }
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    100% { transform: translate(105vw, 120px) scale(1); opacity: 0; }
  }

  /* Shovel Mallet cursor */
  #mallet {
    position: fixed; width: 72px; height: 72px; pointer-events: none; z-index: 9999;
    transform: translate(-30%, -70%) rotate(-12deg);
    transform-origin: 75% 75%;
    transition: transform 0.05s ease-out;
    display: none;
    filter: drop-shadow(3px 8px 10px rgba(0,0,0,0.6));
  }
  #mallet.whack {
    transform: translate(-38%, -65%) rotate(-65deg) scale(0.9);
  }
  body.custom-cursor { cursor: none; }
  body.custom-cursor button, body.custom-cursor .guide { cursor: pointer; }

  header { z-index: 1; text-align: center; }
  h1 {
    font-size: 2.6rem; letter-spacing: 3px; color: #b4ff61;
    text-shadow: 0 0 18px #49e810, 0 4px 0 #1b380a, 0 0 35px rgba(140,50,255,0.6);
    margin-bottom: 6px;
  }

  .hud {
    position: relative; z-index: 1;
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    font-size: 1.1rem; margin-bottom: 12px;
    background: rgba(18, 12, 32, 0.75); padding: 8px 22px; border-radius: 14px;
    border: 1px solid #5a3880; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  }
  .hud-item { display: flex; align-items: center; gap: 6px; }
  .hud b { color: #fff; font-size: 1.25rem; }
  .hud .candy-val { color: #ffd23b; font-weight: 900; }

  /* Timer bar */
  .timer-wrap {
    position: relative; z-index: 1;
    width: 640px; max-width: 95vw; height: 16px; background: #12091d;
    border-radius: 999px; overflow: hidden; border: 2px solid #533177;
    margin-bottom: 12px; box-shadow: inset 0 2px 6px #000;
  }
  #timerBar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff3b3b, #ffd23b, #a0ff4d);
    transition: width 0.1s linear;
  }

  /* Graveyard Ground & Cemetery Plot */
  .cemetery-field {
    position: relative; z-index: 1;
    width: 650px; max-width: 95vw;
    background: radial-gradient(circle at 50% 20%, #2b1f3d, #1a1228 65%, #100b1a);
    border: 4px solid #503173;
    border-radius: 26px;
    padding: 22px 14px 18px;
    box-shadow: 0 16px 36px rgba(0,0,0,0.7), inset 0 2px 10px rgba(180,120,255,0.2), 0 0 24px rgba(60,20,90,0.5);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px 12px;
  }

  /* Grave Plot */
  .grave-plot {
    aspect-ratio: 1;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    background: transparent;
  }

  /* Weathered Tombstone behind the grave */
  .tombstone {
    position: absolute; top: 0; left: 24%; right: 24%; height: 50%;
    background: linear-gradient(180deg, #5c556b 0%, #3e384b 65%, #2a2533 100%);
    border-radius: 20px 20px 0 0;
    border: 2px solid #6b637c;
    border-bottom: none;
    box-shadow: inset 0 3px 5px rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 6px;
    color: #9f97b5;
    z-index: 1;
  }
  .tombstone::after {
    content: "R.I.P.";
    font-size: 0.85rem; font-weight: 900; letter-spacing: 2px;
    opacity: 0.75; text-shadow: 0 1px 1px #000;
  }
  .tombstone .crack {
    position: absolute; top: 20px; right: 8px; width: 8px; height: 12px;
    border-left: 2px solid #231e2b; transform: rotate(15deg);
  }

  /* Grave Hole Pit */
  .grave-pit {
    position: absolute; bottom: 8px; left: 8%; right: 8%; height: 46%;
    background: radial-gradient(ellipse at 50% 40%, #0d0614 0%, #170d24 55%, #2d1844 80%, #3f2260 100%);
    border-radius: 50% / 46%;
    box-shadow: inset 0 8px 16px #000, 0 4px 0 #130a20;
    z-index: 2;
  }

  /* Undead Mole slot */
  .mole-slot {
    position: absolute; inset: 0;
    overflow: hidden;
    z-index: 3;
  }

  .mole {
    position: absolute;
    bottom: -110%;
    left: 14%; right: 14%; height: 86%;
    transition: bottom 0.16s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    cursor: pointer;
    touch-action: manipulation;
  }
  .mole.up {
    bottom: 8%;
  }

  /* Fresh Grave Soil Mound (front lip) */
  .grave-dirt {
    position: absolute; bottom: 0; left: 4%; right: 4%; height: 35%;
    background: radial-gradient(ellipse at 50% -20%, transparent 48%, #36224c 50%, #261737 82%, #190e25 100%);
    border-radius: 50% / 55%;
    z-index: 4;
    pointer-events: none;
    box-shadow: 0 6px 0 #0d0714;
  }
  /* Creepy weeds / graveyard grass */
  .grave-dirt::before {
    content: ""; position: absolute; top: -5px; left: 16%; right: 16%; height: 10px;
    background: radial-gradient(ellipse, #44802c 0%, transparent 70%);
    opacity: 0.7;
  }

  /* Floating Score Tag */
  .score-float {
    position: absolute; z-index: 20;
    font-size: 1.6rem; font-weight: 900;
    color: #a4ff4f; text-shadow: 0 0 10px #000, 0 0 16px #3bff00;
    pointer-events: none;
    animation: floatUp 0.75s ease-out forwards;
    transform: translate(-50%, -50%);
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    25% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -55px) scale(0.9); }
  }

  /* Spooky particles burst */
  .grave-particle {
    position: absolute; pointer-events: none; z-index: 20;
    width: 9px; height: 9px; border-radius: 50%;
    background: #a4ff4f; box-shadow: 0 0 8px #a4ff4f, 0 0 12px #fff;
    animation: particleFly 0.55s ease-out forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* Popups / Landing */
  #overlay, #landing {
    position: fixed; inset: 0; z-index: 100; padding: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  #overlay { background: rgba(5, 3, 10, 0.85); }
  #landing { z-index: 200; background: radial-gradient(ellipse at top, #2b153f 0%, #0c0816 85%); overflow-y: auto; }
  .hidden { display: none !important; }

  .popup {
    background: linear-gradient(#251636, #120b1c);
    border: 3px solid #6c3da8; border-radius: 20px;
    padding: 24px 28px; text-align: center; max-width: 95vw;
    box-shadow: 0 0 50px rgba(140,50,255,0.35), 0 0 20px rgba(70,255,40,0.2);
    animation: pop 0.3s ease-out;
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .popup h2 { font-size: 2.3rem; color: #b4ff61; margin-bottom: 8px; text-shadow: 0 0 14px #49e810; }

  /* Candy reward display */
  #candyReward { margin: 8px 0 12px; }
  #candyReward .big {
    font-size: 6.8rem; font-weight: 900; line-height: 1; color: #ffd23b;
    text-shadow: 0 0 25px #ff9d00, 0 6px 0 #7e4600;
    animation: bigPop .55s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  #candyReward .label { font-size: 1.5rem; color: #ffe9a8; font-weight: bold; margin-top: 4px; }
  @keyframes bigPop { from { transform: scale(0); } to { transform: scale(1); } }

  /* Guide Cards (1-Page) */
  .guide { width: 920px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 12px 0 16px; }
  @media (max-width: 820px) { .steps { grid-template-columns: repeat(2, 1fr); } }
  .step {
    background: rgba(0,0,0,0.45); border: 2px solid #53337a; border-radius: 14px;
    padding: 12px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  }
  .step h3 { font-size: 1.15rem; color: #fff; margin-top: 8px; letter-spacing: 1px; }
  .visual {
    display: flex; align-items: center; justify-content: center; height: 130px; position: relative; width: 100%;
  }
  .result-box { width: 95px; padding: 8px 4px; border-radius: 12px; font-size: 1.4rem; border: 3px solid; }
  .result-box .num { font-size: 1.8rem; font-weight: 900; line-height: 1.1; }
  .result-box.good { border-color: #3cff00; color: #ffd23b; box-shadow: 0 0 14px rgba(60,255,0,0.4); }

  button {
    font-size: 1.3rem; padding: 12px 34px; border-radius: 10px; border: none; cursor: pointer;
    background: #6a34a8; color: #fff; font-weight: bold; letter-spacing: 1px;
    box-shadow: 0 5px 0 #3a1863; margin-top: 6px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  button:hover { background: #7b40bf; }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #3a1863; }

  /* Audio control toggle */
  .audio-btn {
    background: transparent; border: 1px solid #5a3880; box-shadow: none;
    font-size: 1rem; padding: 4px 10px; margin: 0; color: #b4ff61; border-radius: 8px;
  }
  .audio-btn:hover { background: rgba(255,255,255,0.08); }
</style>
</head>

<script>
  // ---------- Spooky Sound Synthesizer (Web Audio API) ----------
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type = 'sine', decay = true) {
    if (!soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      if (decay) {
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      }
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  // Spooky grave rise sound (eerie slide up)
  function sfxPop() {
    if (!soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.14);
    } catch(e) {}
  }

  // Heavy shovel thud / bone smack
  function sfxWhack() {
    if (!soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);

      // Clanging metallic metallic punch
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc2.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
      gain2.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start();
      osc2.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
  }

  // Eerie ghost chime
  function sfxGold() {
    if (!soundEnabled || !audioCtx) return;
    [440, 587, 740, 880, 1174].forEach((f, idx) => {
      setTimeout(() => playTone(f, 0.18, 'sine'), idx * 45);
    });
  }

  // Spooky victory graveyard fanfare
  function sfxWin() {
    if (!soundEnabled || !audioCtx) return;
    [261, 329, 392, 523, 659].forEach((f, idx) => {
      setTimeout(() => playTone(f, 0.28, 'triangle'), idx * 85);
    });
  }

  // Toggle sound
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
  });

  // ---------- Custom Shovel Mallet Cursor ----------
  const mallet = document.getElementById('mallet');
  let hasPointer = false;

  window.addEventListener('mousemove', (e) => {
    if (!hasPointer) {
      hasPointer = true;
      mallet.style.display = 'block';
    }
    mallet.style.left = e.clientX + 'px';
    mallet.style.top = e.clientY + 'px';
  });

  function triggerWhackAnim() {
    mallet.classList.add('whack');
    setTimeout(() => mallet.classList.remove('whack'), 100);
  }

  window.addEventListener('mousedown', (e) => {
    initAudio();
    triggerWhackAnim();
  });

  window.addEventListener('touchstart', (e) => {
    initAudio();
  }, { passive: true });

  // ---------- SVG Undead Zombie Mole Graphics ----------
  function getZombieMoleSVG() {
    return `
      <svg viewBox="0 0 100 110" width="100%" height="100%">
        <!-- Tattered Grave Shroud -->
        <path d="M 12 90 Q 50 78 88 90 L 84 105 L 16 105 Z" fill="#39244d" stroke="#221430" stroke-width="2"/>
        <!-- Undead Body -->
        <ellipse cx="50" cy="78" rx="38" ry="30" fill="#4d7532" stroke="#2a4519" stroke-width="3"/>
        <ellipse cx="50" cy="80" rx="24" ry="18" fill="#699946"/>
        <!-- Undead Head -->
        <ellipse cx="50" cy="50" rx="34" ry="28" fill="#5c8a3c" stroke="#2a4519" stroke-width="3"/>
        <!-- Zombie Head Scar & Stitches -->
        <line x1="32" y1="28" x2="42" y2="38" stroke="#1f3b0e" stroke-width="2.5"/>
        <line x1="33" y1="35" x2="39" y2="31" stroke="#1f3b0e" stroke-width="2"/>
        <line x1="37" y1="38" x2="43" y2="34" stroke="#1f3b0e" stroke-width="2"/>
        <!-- Rotting Snout -->
        <ellipse cx="50" cy="58" rx="19" ry="13" fill="#7ba856"/>
        <ellipse cx="50" cy="52" rx="7" ry="5" fill="#3a1c22" stroke="#1a0b0e" stroke-width="1.5"/>
        <!-- Zombie Crooked Teeth -->
        <rect x="44" y="62" width="5" height="7" rx="1" fill="#fff" stroke="#1a0b0e" stroke-width="1"/>
        <rect x="52" y="62" width="5" height="5" rx="1" fill="#ddd599" stroke="#1a0b0e" stroke-width="1"/>
        <!-- Mismatched Undead Eyes -->
        <!-- Left eye: glowing amber -->
        <circle cx="36" cy="42" r="6" fill="#ffd700" stroke="#1a2e0c" stroke-width="2"/>
        <circle cx="37" cy="41" r="2.5" fill="#1b120c"/>
        <circle cx="38" cy="40" r="1" fill="#fff"/>
        <!-- Right eye: bloodshot small pupil -->
        <circle cx="64" cy="43" r="5" fill="#e8d7d7" stroke="#1a2e0c" stroke-width="2"/>
        <circle cx="64" cy="43" r="1.8" fill="#aa1111"/>
        <!-- Paws with claws -->
        <ellipse cx="26" cy="84" rx="8" ry="6" fill="#7ba856" stroke="#2a4519" stroke-width="2"/>
        <ellipse cx="74" cy="84" rx="8" ry="6" fill="#7ba856" stroke="#2a4519" stroke-width="2"/>
      </svg>
    `;
  }

  function getHitZombieSVG() {
    return `
      <svg viewBox="0 0 100 110" width="100%" height="100%">
        <!-- Body -->
        <ellipse cx="50" cy="78" rx="38" ry="30" fill="#4d7532" stroke="#2a4519" stroke-width="3"/>
        <!-- Head -->
        <ellipse cx="50" cy="52" rx="34" ry="26" fill="#5c8a3c" stroke="#2a4519" stroke-width="3"/>
        <!-- Comical Bone / Skull Bump -->
        <circle cx="34" cy="27" r="10" fill="#9f40ff" stroke="#2a4519" stroke-width="2"/>
        <rect x="29" y="25" width="10" height="4" rx="1" fill="#fff" transform="rotate(25 34 27)"/>
        <!-- Snout -->
        <ellipse cx="50" cy="60" rx="19" ry="13" fill="#7ba856"/>
        <ellipse cx="50" cy="55" rx="7" ry="5" fill="#3a1c22" stroke="#1a0b0e" stroke-width="1.5"/>
        <!-- Dazed Wobbly mouth -->
        <path d="M 43 65 Q 50 70 57 65" fill="none" stroke="#1a0b0e" stroke-width="2.5"/>
        <ellipse cx="54" cy="69" rx="3.5" ry="4" fill="#a82828"/>
        <!-- Spinning X Eyes -->
        <g stroke="#1a0b0e" stroke-width="2.8" stroke-linecap="round">
          <line x1="32" y1="39" x2="40" y2="47"/><line x1="40" y1="39" x2="32" y2="47"/>
          <line x1="60" y1="39" x2="68" y2="47"/><line x1="68" y1="39" x2="60" y2="47"/>
        </g>
        <!-- Flying Bones / Spirits -->
        <text x="18" y="24" font-size="16">🦴</text>
        <text x="66" y="22" font-size="16">⭐</text>
      </svg>
    `;
  }

  function getGoldenGhostSVG() {
    return `
      <svg viewBox="0 0 100 110" width="100%" height="100%">
        <!-- Ectoplasmic Ghost Aura -->
        <circle cx="50" cy="50" r="42" fill="none" stroke="#fff975" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
        <!-- Golden Ghost Body -->
        <path d="M 20 86 Q 16 30 50 20 Q 84 30 80 86 Q 70 76 60 86 Q 50 76 40 86 Q 30 76 20 86 Z"
              fill="url(#goldGrad)" stroke="#b57e07" stroke-width="3"/>
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff580"/>
            <stop offset="60%" stop-color="#e5aa1c"/>
            <stop offset="100%" stop-color="#ab7508"/>
          </linearGradient>
        </defs>
        <!-- Cool Tombstone Sunglasses -->
        <rect x="26" y="40" width="20" height="13" rx="3" fill="#150d1f" stroke="#fff" stroke-width="1.5"/>
        <rect x="54" y="40" width="20" height="13" rx="3" fill="#150d1f" stroke="#fff" stroke-width="1.5"/>
        <line x1="46" y1="44" x2="54" y2="44" stroke="#fff" stroke-width="2"/>
        <!-- Snout -->
        <ellipse cx="50" cy="60" rx="14" ry="9" fill="#ffe994"/>
        <ellipse cx="50" cy="56" rx="5" ry="4" fill="#6d3f00"/>
        <!-- Golden Sparkles -->
        <circle cx="16" cy="30" r="3" fill="#fff"/>
        <circle cx="84" cy="32" r="3" fill="#fff"/>
      </svg>
    `;
  }

  // ---------- Game Engine ----------
  const ROUND_TIME = 30; // seconds
  let timeLeft = ROUND_TIME;
  let score = 0;
  let whacks = 0;
  let totalCandy = 0;
  let isPlaying = false;
  let timerInterval = null;
  let spawnTimeout = null;

  const gridEl = document.getElementById('grid');
  const fieldEl = document.getElementById('field');
  const timeValEl = document.getElementById('timeVal');
  const scoreValEl = document.getElementById('scoreVal');
  const whacksValEl = document.getElementById('whacksVal');
  const totalCandyEl = document.getElementById('totalCandy');
  const timerBar = document.getElementById('timerBar');

  const overlay = document.getElementById('overlay');
  const landing = document.getElementById('landing');
  const ovTitle = document.getElementById('ovTitle');
  const ovSummary = document.getElementById('ovSummary');
  const candyReward = document.getElementById('candyReward');
  const startGuideBtn = document.getElementById('startGuideBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');

  // Build 9 grave plots
  const holes = [];
  for (let i = 0; i < 9; i++) {
    const graveWrap = document.createElement('div');
    graveWrap.className = 'grave-plot';
    graveWrap.innerHTML = `
      <div class="tombstone">
        <div class="crack"></div>
      </div>
      <div class="grave-pit"></div>
      <div class="mole-slot">
        <div class="mole" data-index="${i}"></div>
      </div>
      <div class="grave-dirt"></div>
    `;
    gridEl.appendChild(graveWrap);

    const moleEl = graveWrap.querySelector('.mole');
    holes.push({
      index: i,
      container: graveWrap,
      mole: moleEl,
      isUp: false,
      isGolden: false,
      isHit: false,
      hideTimeout: null
    });

    // Whack handler (supports click & touch)
    const handleHit = (e) => {
      e.preventDefault();
      whackHole(i, e);
    };
    moleEl.addEventListener('mousedown', handleHit);
    moleEl.addEventListener('touchstart', handleHit, { passive: false });
  }

  function whackHole(index, event) {
    if (!isPlaying) return;
    const h = holes[index];
    if (!h.isUp || h.isHit) return;

    h.isHit = true;
    whacks++;
    whacksValEl.textContent = whacks;

    clearTimeout(h.hideTimeout);

    // Score & Sound
    let pts = 100;
    if (h.isGolden) {
      pts = 300;
      sfxGold();
    } else {
      sfxWhack();
    }
    score += pts;
    scoreValEl.textContent = score;

    // Hit graphics
    h.mole.innerHTML = getHitZombieSVG();

    // Floating score tag & particles
    const rect = h.mole.getBoundingClientRect();
    const fieldRect = fieldEl.getBoundingClientRect();
    const spawnX = rect.left + rect.width / 2 - fieldRect.left;
    const spawnY = rect.top + rect.height / 3 - fieldRect.top;
    createScoreFloat(spawnX, spawnY, `+${pts}`);
    createBurst(spawnX, spawnY, h.isGolden);

    // Retract zombie mole back into grave
    setTimeout(() => {
      h.mole.classList.remove('up');
      setTimeout(() => {
        h.isUp = false;
        h.isHit = false;
      }, 160);
    }, 280);
  }

  function createScoreFloat(x, y, text) {
    const el = document.createElement('div');
    el.className = 'score-float';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.textContent = text;
    fieldEl.appendChild(el);
    setTimeout(() => el.remove(), 750);
  }

  function createBurst(x, y, isGold) {
    for (let i = 0; i < 9; i++) {
      const p = document.createElement('div');
      p.className = 'grave-particle';
      if (isGold) {
        p.style.background = '#ffd747';
        p.style.boxShadow = '0 0 10px #ffd747, 0 0 14px #fff';
      }
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      const angle = (Math.PI * 2 * i) / 9;
      const dist = 26 + Math.random() * 22;
      p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
      p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
      fieldEl.appendChild(p);
      setTimeout(() => p.remove(), 550);
    }
  }

  // Zombie Mole rise logic
  function popRandomMole() {
    if (!isPlaying) return;

    const available = holes.filter(h => !h.isUp);
    if (available.length > 0) {
      const h = available[Math.floor(Math.random() * available.length)];
      h.isUp = true;
      h.isHit = false;

      // 20% chance of golden ghost mole
      h.isGolden = Math.random() < 0.20;
      h.mole.innerHTML = h.isGolden ? getGoldenGhostSVG() : getZombieMoleSVG();
      h.mole.classList.add('up');
      sfxPop();

      // Time zombie stays up from grave (speeds up as round progresses)
      const elapsed = ROUND_TIME - timeLeft;
      const stayDuration = Math.max(540, 1080 - elapsed * 17);

      h.hideTimeout = setTimeout(() => {
        if (h.isUp && !h.isHit) {
          h.mole.classList.remove('up');
          setTimeout(() => {
            h.isUp = false;
          }, 160);
        }
      }, stayDuration);
    }

    // Schedule next grave spawn
    const elapsed = ROUND_TIME - timeLeft;
    const nextSpawnDelay = Math.max(370, 840 - elapsed * 14);
    spawnTimeout = setTimeout(popRandomMole, nextSpawnDelay);
  }

  // Start game session
  function startGame() {
    initAudio();
    landing.classList.add('hidden');
    overlay.classList.add('hidden');

    // Fresh round reset
    score = 0;
    whacks = 0;
    totalCandy = 0;
    timeLeft = ROUND_TIME;

    scoreValEl.textContent = '0';
    whacksValEl.textContent = '0';
    totalCandyEl.textContent = '0';
    timeValEl.textContent = `${ROUND_TIME}s`;
    timerBar.style.width = '100%';

    // Clear any active graves
    holes.forEach(h => {
      clearTimeout(h.hideTimeout);
      h.isUp = false;
      h.isHit = false;
      h.mole.classList.remove('up');
    });

    isPlaying = true;
    popRandomMole();

    const startTimestamp = performance.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsedSec = (performance.now() - startTimestamp) / 1000;
      timeLeft = Math.max(0, ROUND_TIME - elapsedSec);

      timeValEl.textContent = `${Math.ceil(timeLeft)}s`;
      timerBar.style.width = `${(timeLeft / ROUND_TIME) * 100}%`;

      if (timeLeft <= 0) {
        endGame();
      }
    }, 100);
  }

  function endGame() {
    isPlaying = false;
    clearInterval(timerInterval);
    clearTimeout(spawnTimeout);

    holes.forEach(h => {
      clearTimeout(h.hideTimeout);
      h.mole.classList.remove('up');
      h.isUp = false;
    });

    sfxWin();

    // Reward: 2 to 10 candy (consistent with user request)
    const earnedCandy = Math.floor(Math.random() * 9) + 2; // 2–10
    totalCandy = earnedCandy;
    totalCandyEl.textContent = totalCandy;

    ovTitle.textContent = '⚰️ GRAVEYARD CLEARED! ⚰️';
    candyReward.innerHTML = `<div class="big">${earnedCandy}</div><div class="label">🍬 CANDY 🍬</div>`;
    ovSummary.innerHTML = `You whacked <b>${whacks}</b> ghouls for a score of <b>${score}</b>!`;

    overlay.classList.remove('hidden');
  }

  // Buttons
  startGuideBtn.addEventListener('click', startGame);
  playAgainBtn.addEventListener('click', startGame);
</script>
</body>
</html>
